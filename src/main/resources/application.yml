spring:
  autoconfigure:
    exclude:
      # 2.0.0-M1.1 打包缺陷（必须保留）：autoconfigure jar 的 imports 清单登记了未打包的
      # DashScopeMultimodalEmbeddingAutoConfiguration，不排除则启动期装配排序直接抛 FileNotFoundException
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeMultimodalEmbeddingAutoConfiguration
  sql:
    init:
      # schema.sql 使用 IF NOT EXISTS，启动时幂等创建 product_order
      mode: always
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  application:
    name: gaoyang-spring-ai
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    host: localhost
    port: 5432
    user: postgres
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE
    mcp:
      client:
        enabled: true
        name: gaoyang-mcp-client
        version: 1.0.0
        type: SYNC
        toolcallback:
          enabled: true
        streamable-http:
          connections:
          # MCP 服务 1：本地生活服务（当前进程自身 MCP Server）
          #  life:
          #    url: http://localhost:8088
          #    endpoint: /mcp
          # MCP 服务 2：天气服务（示例，需另行启动）
          # weather:
          #   url: http://localhost:8089
          #   endpoint: /mcp
      server:
        name: gaoyang-mcp-server
        version: 1.0.0
        # SSE 连接端点（客户端 GET 建立长连接），默认 /sse
        sse-endpoint: /sse
        # 消息端点（客户端 POST 发送工具调用），默认 /mcp/message
        sse-message-endpoint: /mcp/messages
        # 同进程内 MCP Client/Server 共存时禁用 server 侧 tool-callback-converter,
        # 避免 syncTools Bean 触发 McpSyncClient.initialize() 导致启动超时
        tool-callback-converter: false
    model:
      chat: dashscope
      embedding:
        # DashScope Embedding 装配条件读 spring.ai.model.embedding.text（matchIfMissing=true，不设即激活）
        # 显式指定 ollama 使其让位，全局仅保留 ollamaEmbeddingModel
        text: ollama
    # 百炼 DashScope：chat 走云端 qwen-plus（embedding 仍用本地 Ollama，向量空间不变）
    dashscope:
      base-url: https://dashscope.aliyuncs.com
      # 启动前设置环境变量 DASHSCOPE_API_KEY，缺失时启动失败而非静默使用空密钥
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        # chat 模型已在 ChatClientConfig 手动创建（dashScopeChatModel），关闭自动装配避免重复 Bean
        enabled: false
        options:
          model: qwen-plus
          temperature: 0.7
    ollama:
      base-url: http://localhost:11434
      chat:
        model: Qwen2.5:7b
        temperature: 0.7
        num-predict: 1024
      embedding:
        model: nomic-embed-text
      init:
        timeout: 1m
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2


mybatis-plus:
  #mapper xml位置,默认即classpath*:/mapper/**/*.xml,此处显式声明
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

mcp:
  auth:
    # MCP Server 凭证，客户端需携带 Authorization: Bearer <token> 访问
    token: 123

livetalking:
  base-url: http://localhost:8010

speaches:
  base-url: http://localhost:8000
  model: Systran/faster-distil-whisper-large-v3

searxng:
  base-url: http://localhost:8888

logging:
  level:
    org.springframework.ai: INFO
